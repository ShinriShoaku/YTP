<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>OBS – Now Playing CYBER</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700;900&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --c-green:#00ff9d; --c-cyan:#00e5ff; --c-yellow:#ffe600;
  --c-red:#ff2b4e; --c-bg:rgba(2,8,12,0.93);
  --title-size:20px; --opacity:0.93;
}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;
  font-family:'Share Tech Mono',monospace;color:var(--c-green);}

/* scanlines */
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:99999;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,0.12) 0px,rgba(0,0,0,0.12) 1px,transparent 1px,transparent 3px);}

/* ── MAIN BAR ── */
#now-playing{
  position:fixed;bottom:0;left:0;right:0;
  min-height:92px;
  display:flex;align-items:center;gap:0;
  background:var(--c-bg);
  overflow:hidden;
}
#now-playing.hidden{display:none;}

/* top border animated */
#now-playing::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--c-green),var(--c-cyan),var(--c-green),transparent);
  background-size:200% 100%;
  animation:borderFlow 3s linear infinite;
}
@keyframes borderFlow{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* left accent column */
#np-accent-col{
  width:6px;height:100%;flex-shrink:0;
  background:linear-gradient(180deg,var(--c-green),var(--c-cyan));
  box-shadow:0 0 12px var(--c-green);
  position:relative;
}

/* disc */
#np-disc{
  width:64px;height:64px;border-radius:0;
  flex-shrink:0;margin:0 20px;
  display:flex;align-items:center;justify-content:center;
  font-size:26px;
  border:1px solid var(--c-green);
  position:relative;
  background:rgba(0,255,157,0.05);
  clip-path:polygon(10% 0,90% 0,100% 10%,100% 90%,90% 100%,10% 100%,0 90%,0 10%);
  animation:rotateSlow 8s linear infinite;
  box-shadow:0 0 16px rgba(0,255,157,0.3),inset 0 0 12px rgba(0,255,157,0.05);
}
#np-disc.paused{animation-play-state:paused;}
#np-disc.hidden{display:none!important;}
@keyframes rotateSlow{to{transform:rotate(360deg);}}

/* thumb */
#np-thumb{
  width:64px;height:64px;flex-shrink:0;margin:0 20px;
  object-fit:cover;
  clip-path:polygon(10% 0,90% 0,100% 10%,100% 90%,90% 100%,10% 100%,0 90%,0 10%);
  border:1px solid var(--c-cyan);
  box-shadow:0 0 12px rgba(0,229,255,0.4);
}
#np-thumb.hidden{display:none;}

/* info section */
#np-info{flex:1;min-width:0;padding:12px 0;}
#np-label{
  font-family:'Orbitron',monospace;font-size:9px;font-weight:700;
  letter-spacing:3px;text-transform:uppercase;
  color:var(--c-cyan);margin-bottom:5px;
  display:flex;align-items:center;gap:8px;
}
#tiktok-dot{
  width:7px;height:7px;border-radius:50%;background:var(--c-red);
  display:inline-block;transition:background .3s;
}
#tiktok-dot.online{background:var(--c-green);box-shadow:0 0 6px var(--c-green);animation:blink 1.5s infinite;}
#tiktok-dot.off{display:none;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

#np-title{
  font-family:'Orbitron',monospace;
  font-size:var(--title-size);font-weight:900;
  letter-spacing:1px;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  color:var(--c-green);
  text-shadow:0 0 8px var(--c-green),0 0 20px rgba(0,255,157,0.4);
}
#np-title.idle{color:rgba(0,255,157,0.35);font-size:14px;font-weight:700;font-family:'Share Tech Mono',monospace;letter-spacing:2px;}

#np-meta{
  margin-top:5px;display:flex;align-items:center;gap:10px;
  font-size:11px;letter-spacing:1px;
}
#np-channel{color:rgba(0,229,255,0.6);}
#np-channel.hidden{display:none;}
#np-requester{
  border:1px solid rgba(0,255,157,0.3);
  padding:1px 8px;font-size:10px;
  color:var(--c-cyan);letter-spacing:1px;
}
#np-requester.hidden{display:none;}

/* right section */
#np-right{
  display:flex;flex-direction:column;align-items:flex-end;
  gap:8px;padding:12px 24px;flex-shrink:0;
}
#np-queue-badge{
  font-family:'Orbitron',monospace;font-size:10px;font-weight:700;
  letter-spacing:2px;
  color:var(--c-yellow);
  border:1px solid rgba(255,230,0,0.35);
  padding:4px 12px;
  text-shadow:0 0 8px var(--c-yellow);
}
#skip-vote-bar{
  display:flex;align-items:center;gap:6px;
  font-size:10px;color:rgba(0,255,157,0.5);
  letter-spacing:1px;opacity:0;transition:opacity .3s;
}
#skip-vote-bar.visible{opacity:1;}
#skip-vote-bar.hidden{display:none!important;}
.skip-dot{
  width:7px;height:7px;
  border:1px solid rgba(0,255,157,0.3);
  transition:background .2s;
}
.skip-dot.filled{background:var(--c-yellow);border-color:var(--c-yellow);box-shadow:0 0 4px var(--c-yellow);}

/* progress */
#np-progress-wrap{position:absolute;bottom:0;left:6px;right:0;height:2px;background:rgba(0,255,157,0.08);}
#np-progress-wrap.hidden{display:none;}
#np-progress-bar{
  height:100%;background:linear-gradient(90deg,var(--c-green),var(--c-cyan));
  width:0%;transition:width 1s linear;
  box-shadow:0 0 8px var(--c-cyan);
  position:relative;
}
#np-progress-bar::after{
  content:'';position:absolute;right:0;top:-2px;
  width:4px;height:6px;background:var(--c-cyan);
  box-shadow:0 0 6px var(--c-cyan);
}

/* glitch on song change */
@keyframes glitchIn{
  0%{clip-path:inset(0 100% 0 0);opacity:0;}
  40%{clip-path:inset(0 10% 0 0);opacity:.8;}
  70%{clip-path:inset(0 2% 0 0);opacity:1;}
  100%{clip-path:inset(0 0 0 0);opacity:1;}
}
.glitch-in{animation:glitchIn .3s steps(3) both;}
</style>
</head>
<body>
<div id="now-playing">
  <div id="np-accent-col"></div>
  <div id="np-disc">◈</div>
  <img id="np-thumb" class="hidden" alt="">
  <div id="np-info">
    <div id="np-label">
      <span id="tiktok-dot"></span>
      ▶ NOW PLAYING
    </div>
    <div id="np-title" class="idle">// AWAITING SIGNAL...</div>
    <div id="np-meta">
      <span id="np-channel"></span>
      <span id="np-requester" class="hidden"></span>
    </div>
  </div>
  <div id="np-right">
    <div id="np-queue-badge">⬡ 0 IN QUEUE</div>
    <div id="skip-vote-bar">
      <span>SKIP</span>
      <div id="skip-vote-dots"></div>
      <span id="skip-vote-count">0/5</span>
    </div>
  </div>
  <div id="np-progress-wrap"><div id="np-progress-bar"></div></div>
</div>
<script>
const API='http://localhost:8000';
let state={current_song:null,is_playing:false,is_paused:false,queue_count:0,tiktok_connected:false,skip_votes:0,skip_threshold:5,elapsed_ms:0};
let cfg={};
let songStartedAt=0,songDurationMs=0,progressTimer=null;

function applyConfig(c){
  cfg=c;
  document.documentElement.style.setProperty('--c-green',c.accent_color||'#00ff9d');
  document.documentElement.style.setProperty('--c-cyan',c.accent_color2||'#00e5ff');
  document.documentElement.style.setProperty('--title-size',(c.font_size_title||20)+'px');
  toggle('now-playing',c.show_now_playing!==false);
  toggle('skip-vote-bar',c.show_skip_vote!==false,'hidden');
  toggle('np-progress-wrap',c.show_progress_bar!==false);
  const dot=document.getElementById('tiktok-dot');
  if(c.show_tiktok_dot===false)dot.classList.add('off');else dot.classList.remove('off');
  render();
}
function toggle(id,show,cls='hidden'){const el=document.getElementById(id);if(!el)return;show?el.classList.remove(cls):el.classList.add(cls);}

function render(){
  const song=state.current_song;
  const title=document.getElementById('np-title');
  const chanEl=document.getElementById('np-channel');
  const reqEl=document.getElementById('np-requester');
  const thumb=document.getElementById('np-thumb');
  const disc=document.getElementById('np-disc');
  document.getElementById('np-queue-badge').textContent=`⬡ ${state.queue_count||0} IN QUEUE`;
  if(!song||!state.is_playing){
    title.textContent='// AWAITING SIGNAL...';title.className='idle';
    chanEl.textContent='';reqEl.classList.add('hidden');
    thumb.classList.add('hidden');disc.style.display='flex';disc.className='';
    stopProgress();return;
  }
  // glitch entry
  title.classList.remove('glitch-in');void title.offsetWidth;title.classList.add('glitch-in');
  title.textContent=song.title;title.className='glitch-in';
  chanEl.textContent=cfg.show_channel!==false?song.channel||'':'';
  cfg.show_channel!==false?chanEl.classList.remove('hidden'):chanEl.classList.add('hidden');
  if(song.requested_by&&cfg.show_requester!==false){reqEl.textContent='◈ @'+song.requested_by;reqEl.classList.remove('hidden');}
  else reqEl.classList.add('hidden');
  if(song.thumbnail&&cfg.show_thumbnail!==false){thumb.src=song.thumbnail;thumb.classList.remove('hidden');disc.style.display='none';}
  else{thumb.classList.add('hidden');disc.style.display='flex';}
  disc.className=state.is_paused?'paused':'';
  if(state.is_playing&&!state.is_paused){songStartedAt=Date.now()-(state.elapsed_ms||0);songDurationMs=(song.duration||0)*1000;startProgress();}
  else stopProgress();
}
function startProgress(){stopProgress();if(!songDurationMs||cfg.show_progress_bar===false)return;const bar=document.getElementById('np-progress-bar');progressTimer=setInterval(()=>{const p=Math.min(100,((Date.now()-songStartedAt)/songDurationMs)*100);bar.style.width=p+'%';if(p>=100)stopProgress();},500);}
function stopProgress(){if(progressTimer){clearInterval(progressTimer);progressTimer=null;}document.getElementById('np-progress-bar').style.width='0%';}
function updateSkipVote(){
  const bar=document.getElementById('skip-vote-bar'),dots=document.getElementById('skip-vote-dots'),countEl=document.getElementById('skip-vote-count');
  const v=state.skip_votes||0,t=state.skip_threshold||5;
  countEl.textContent=`${v}/${t}`;
  dots.innerHTML=Array.from({length:t},(_,i)=>`<div class="skip-dot${i<v?' filled':''}"></div>`).join('');
  if(cfg.show_skip_vote!==false)bar.classList.toggle('visible',v>0);
}
function updateDot(){
  const d=document.getElementById('tiktok-dot');
  if(cfg.show_tiktok_dot===false){d.classList.add('off');return;}
  d.classList.remove('off');d.classList.toggle('online',!!state.tiktok_connected);
}
function connectSSE(){
  const es=new EventSource(`${API}/overlay/events`);
  es.addEventListener('init',e=>{Object.assign(state,JSON.parse(e.data));render();updateSkipVote();updateDot();});
  es.addEventListener('player_state',e=>{Object.assign(state,JSON.parse(e.data));render();});
  es.addEventListener('skip_vote',e=>{const d=JSON.parse(e.data);state.skip_votes=d.votes;state.skip_threshold=d.threshold;updateSkipVote();});
  es.addEventListener('skip_executed',()=>{state.skip_votes=0;updateSkipVote();});
  es.addEventListener('tiktok_status',e=>{state.tiktok_connected=JSON.parse(e.data).connected;updateDot();});
  es.addEventListener('player_stopped',()=>{state.current_song=null;state.is_playing=false;state.skip_votes=0;render();updateSkipVote();});
  es.addEventListener('overlay_config',e=>{applyConfig(JSON.parse(e.data));});
  es.onerror=()=>{es.close();setTimeout(()=>{poll();setTimeout(connectSSE,5000);},2000);};
}
async function poll(){try{const r=await fetch(`${API}/overlay/state`);if(r.ok){Object.assign(state,await r.json());render();}}catch(_){}}
async function init(){try{const r=await fetch(`${API}/overlay/config`);if(r.ok)applyConfig(await r.json());}catch(_){}connectSSE();setInterval(poll,10000);}
init();
</script>
</body>
</html>
